# The whole platform, one command:
#
#     docker compose up --build
#
# auth-service   http://localhost:8081/swagger-ui.html
# user-service   http://localhost:8082/swagger-ui.html
# JWKS           http://localhost:8081/.well-known/jwks.json
#
# A locally installed PostgreSQL usually owns 5432. If `docker compose up` reports
# "address already in use", publish it somewhere else -- nothing inside the stack depends
# on the mapping, since the services reach the database over the compose network:
#
#     POSTGRES_HOST_PORT=5433 docker compose up --build
name: tenantbase

services:
  postgres:
    image: postgres:17-alpine
    container_name: tenantbase-postgres
    environment:
      # auth-service's database. Every other service's is created by init-db.sql.
      POSTGRES_DB: tenantbase_auth
      POSTGRES_USER: tenantbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenantbase}
    ports:
      # Only for psql and GUI clients; the services do not use it.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume above. `docker compose down -v`
      # to force it to run again after editing.
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenantbase -d tenantbase_auth']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: tenantbase-auth-service
    depends_on:
      postgres:
        # Not just "started": Flyway runs during startup and would fail against a database
        # that is still initialising.
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tenantbase_auth
      DB_USERNAME: tenantbase
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tenantbase}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tenantbase-api}
      # Uncomment together with the volume below to sign with a persistent key pair.
      # Without them the service generates a throwaway key at every startup and logs a warning.
      # TENANTBASE_SECURITY_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt/app.key
      # TENANTBASE_SECURITY_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt/app.pub
      LOG_LEVEL: INFO
    # volumes:
    #   - ./infra/keys:/run/secrets/jwt:ro
    ports:
      - '8081:8081'
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: tenantbase-user-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        # Only so the JWKS endpoint is reachable on first use. The key is fetched lazily and then
        # cached, so a later auth-service restart does not take this service down with it.
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tenantbase_users
      DB_USERNAME: tenantbase
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tenantbase}
      # Reached over the compose network by service name, not through a published port.
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      # Must match what auth-service stamps into the tokens it signs, or every request is a 401.
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8081}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tenantbase-api}
      LOG_LEVEL: INFO
    ports:
      - '8082:8082'
    restart: unless-stopped

  # rabbitmq and the gateway land here as they are built.

volumes:
  postgres-data:
